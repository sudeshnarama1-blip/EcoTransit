<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#051F20">
    <title>EcoTransit - Offline</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .offline-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            gap: 16px;
        }
        .offline-wrap img { width: 96px; height: 96px; border-radius: 22px; }
        .offline-wrap p { color: #8EB69B; max-width: 320px; }
    </style>
</head>
<body>
<div class="offline-wrap">
    <img src="icons/icon-192.png" alt="">
    <h2>You're offline</h2>
    <p>EcoTransit needs an internet connection to show rides and bookings. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
